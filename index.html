<html>
<head>
  <title>Noisy Screen Capture</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="toggleMenu">☰</button>
  <div class="controls">
    <button id="startCapture">Start Screen Capture</button>
    <button id="selectRegion">Select Region</button>
    <button id="clearRegion" style="display: none;">Clear Region</button>
    <button id="toggleFilter">Disable Filter</button>
    <button id="toggleRegionMode">Filter Inside Region</button>
    <button id="toggleAscii">Enable ASCII</button>
    <button id="toggleRainbow">Enable Rainbow</button>
    <div class="slider-container">
      <label for="sensitivity">Sensitivity:</label>
      <input type="range" id="sensitivity" min="0" max="100" value="10">
      <span id="sensitivityValue">10%</span>
    </div>
    <div class="slider-container ascii-settings">
      <label for="asciiDetail">ASCII Detail:</label>
      <input type="range" id="asciiDetail" min="4" max="16" value="8">
      <span id="asciiDetailValue">8px</span>
    </div>
    <div class="color-picker-container ascii-settings">
      <label for="asciiColor">ASCII Color:</label>
      <button id="asciiColorToggle">Use Original Colors</button>
      <input type="color" id="asciiColor" value="#ffffff" style="display: none;">
    </div>
  </div>
  <canvas id="noiseCanvas"></canvas>
  <script type="module" src="noise.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
